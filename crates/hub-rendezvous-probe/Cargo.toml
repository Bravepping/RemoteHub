[package]
name = "hub-rendezvous-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
hub-signal-v2 = { path = "../hub-signal-v2" }
hub-probe-wire = { path = "../hub-probe-wire" }
hub-turn-credentials = { path = "../hub-turn-credentials" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = { version = "=0.8.8", features = ["ws"] }
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
uuid = { version = "=1.29.3", features = ["v4"] }
zeroize = "=1.9.2"
ring = "=0.17.14"

[dev-dependencies]
rtc = { version = "=0.21.1", default-features = false }
async-trait = "=0.1.92"
hub-webrtc = { path = "../hub-webrtc", features = ["v2-loopback-signaling"] }
webrtc = "=0.21.1"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
