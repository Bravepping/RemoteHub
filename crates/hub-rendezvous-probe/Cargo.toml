[package]
name = "hub-rendezvous-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "v2_synthetic_profile_check"
path = "src/bin/v2_synthetic_profile_check.rs"
required-features = ["v2-synthetic-profile-check"]

[[test]]
name = "synthetic-profile-cli"
path = "tests/synthetic_profile_cli.rs"
required-features = ["v2-synthetic-profile-check"]

[[test]]
name = "remotehub-native-wss-consent-check"
path = "tests/native_wss_consent_check.rs"
harness = false
test = false
required-features = ["v2-native-wss-consent-manual"]

[[test]]
name = "synthetic-wss-admission"
path = "tests/synthetic_wss_admission.rs"
required-features = ["v2-synthetic-admission-test"]

[features]
v2-native-wss-consent-manual = []
v2-synthetic-admission-test = ["hub-signal-v2/synthetic-admission", "hub-webrtc/v2-synthetic-admission-rtc-test"]
v2-synthetic-profile-check = ["dep:hub-identity", "dep:libc", "hub-webrtc/v2-synthetic-role-profile"]
v2-synthetic-video = ["dep:hub-identity", "dep:hub-webrtc", "dep:rtc", "dep:async-trait", "dep:webrtc"]

[dependencies]
hub-signal-v2 = { path = "../hub-signal-v2" }
hub-probe-wire = { path = "../hub-probe-wire" }
hub-turn-credentials = { path = "../hub-turn-credentials" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = { version = "=0.8.8", features = ["ws"] }
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
uuid = { version = "=1.29.3", features = ["v4"] }
zeroize = "=1.9.2"
ring = "=0.17.14"

rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
time = "=0.3.55"
hub-identity = { path = "../hub-identity", features = ["ephemeral-test"], optional = true }
rtc = { version = "=0.21.1", default-features = false, optional = true }
async-trait = { version = "=0.1.92", optional = true }
hub-webrtc = { path = "../hub-webrtc", features = ["v2-public-video-wss"], optional = true }
webrtc = { version = "=0.21.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "=0.2.191", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
hub-identity = { path = "../hub-identity", features = ["ephemeral-test"] }
rtc = { version = "=0.21.1", default-features = false }
async-trait = "=0.1.92"
hub-webrtc = { path = "../hub-webrtc", features = ["v2-verified-signaling", "v2-public-video-wss", "v2-input-approval"] }
webrtc = "=0.21.1"
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
