[package]
name = "hub-signal-v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
public-control = []
synthetic-admission = ["dep:sha2"]

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "=0.10.9", optional = true }
thiserror.workspace = true
tokio = { version = "=1.54.1", features = ["net", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
uuid = { version = "=1.29.3", features = ["v4"] }
zeroize = "=1.9.2"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
tokio = { version = "=1.54.1", features = ["macros", "rt"] }
