[package]
name = "hub-webrtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
v2-loopback-signaling = ["dep:hub-signal-v2"]
v2-verified-signaling = ["v2-loopback-signaling", "dep:hub-identity"]
v2-verified-lan = ["p3-lan", "dep:hub-identity"]
v2-public-video = ["dep:hub-identity", "p006-direct-probe"]
v2-public-video-wss = ["v2-public-video", "v2-loopback-signaling"]
v2-public-video-60s-test = ["v2-public-video-wss"]
v2-input-approval = []
v2-public-fake-input-proof = ["v2-public-video", "v2-input-approval"]
v2-synthetic-admission-rtc-test = ["v2-public-fake-input-proof"]
v2-synthetic-role-profile = ["v2-public-fake-input-proof", "dep:rustls"]
v2-public-fake-input-loopback-check = [
  "v2-public-fake-input-proof", "hub-identity/ephemeral-test", "dep:rcgen",
  "dep:rustls", "dep:futures-util", "dep:tokio-rustls", "dep:tokio-tungstenite",
]
v2-public-fake-input-process-check = [
  "v2-public-fake-input-proof", "hub-identity/ephemeral-test", "dep:rcgen",
  "dep:rustls", "dep:futures-util", "dep:tokio-rustls", "dep:tokio-tungstenite", "tokio/process",
  "dep:windows-sys", "windows-sys/Win32_Storage_FileSystem", "windows-sys/Win32_System_Pipes",
  "windows-sys/Win32_System_SystemInformation",
]
v2-native-input-consent-check = ["v2-input-approval", "dep:windows-sys", "windows-sys/Win32_UI_WindowsAndMessaging"]
v2-private-wss-lan = ["v2-verified-lan", "v2-loopback-signaling"]
p3-lan = [
  "dep:windows-sys", "windows-sys/Win32_UI_Input_KeyboardAndMouse",
  "windows-sys/Win32_UI_WindowsAndMessaging", "windows-sys/Win32_UI_HiDpi",
]
p3-lan-input-queue-test = ["p3-lan", "v2-input-approval"]
p006-turn-probe = ["dep:zeroize"]
p006-direct-probe = ["p006-turn-probe"]
p006-direct = ["p006-relay", "p006-direct-probe"]
p006-session-probe = ["p006-direct", "hub-encode-win/synthetic-stream"]
p006-relay = ["p006-turn-probe", "dep:hub-probe-wire", "dep:tokio-tungstenite", "dep:rustls", "dep:rustls-pemfile", "dep:futures-util", "dep:ring"]

[[test]]
name = "remotehub-wss-turn-loopback-check"
path = "tests/wss_turn_loopback_check.rs"
harness = false
test = false
required-features = ["v2-public-fake-input-loopback-check"]

[[test]]
name = "remotehub-wss-signed-sdp-process-check"
path = "tests/wss_signed_sdp_process_check.rs"
harness = false
test = false
required-features = ["v2-public-fake-input-process-check"]

[[bin]]
name = "turn-allocate-probe"
path = "src/bin/turn-allocate-probe.rs"
required-features = ["p006-turn-probe"]

[[bin]]
name = "remotehub-input-local-check"
path = "src/bin/remotehub-input-local-check.rs"
required-features = ["v2-input-approval"]

[[bin]]
name = "remotehub-native-consent-check"
path = "src/bin/remotehub-native-consent-check.rs"
required-features = ["v2-native-input-consent-check"]

[[bin]]
name = "ice-path-probe"
path = "src/bin/ice-path-probe.rs"
required-features = ["p006-direct-probe"]

[[bin]]
name = "video-session-probe"
path = "src/bin/video-session-probe.rs"
required-features = ["p006-session-probe"]

[[bin]]
name = "authenticated-session-probe"
path = "src/bin/authenticated-session-probe.rs"
required-features = ["p006-session-probe"]

[dependencies]
hub-identity = { path = "../hub-identity", optional = true }
hub-signal-v2 = { path = "../hub-signal-v2", optional = true }
hub-encode-win = { path = "../hub-encode-win" }
serde.workspace = true
serde_json.workspace = true
webrtc = "=0.21.1"
rtc = { version = "=0.21.1", default-features = false }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
async-trait = "=0.1.92"
bytes = "=1.12.2"
hmac = "=0.12.1"
sha2 = "=0.10.9"
uuid = { version = "=1.29.3", features = ["v4"] }
zeroize = { version = "=1.9.2", optional = true }
hub-probe-wire = { path = "../hub-probe-wire", optional = true }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"], optional = true }
rustls-pemfile = { version = "=2.2.0", optional = true }
futures-util = { version = "=0.3.34", features = ["sink"], optional = true }
ring = { version = "=0.17.14", optional = true }

rcgen = { version = "=0.14.10", default-features = false, features = ["ring"], optional = true }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Foundation"] }

[dev-dependencies]
hub-identity = { path = "../hub-identity", features = ["ephemeral-test"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
