[package]
name = "hub-webrtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
p006-turn-probe = ["dep:zeroize"]
p006-relay = ["p006-turn-probe", "dep:hub-probe-wire", "dep:tokio-tungstenite", "dep:rustls", "dep:rustls-pemfile", "dep:futures-util", "dep:ring"]

[[bin]]
name = "turn-allocate-probe"
path = "src/bin/turn-allocate-probe.rs"
required-features = ["p006-turn-probe"]

[dependencies]
hub-encode-win = { path = "../hub-encode-win" }
serde.workspace = true
serde_json.workspace = true
webrtc = "=0.21.1"
rtc = { version = "=0.21.1", default-features = false }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
async-trait = "=0.1.92"
bytes = "=1.12.2"
hmac = "=0.12.1"
sha2 = "=0.10.9"
uuid = { version = "=1.29.3", features = ["v4"] }
zeroize = { version = "=1.9.2", optional = true }
hub-probe-wire = { path = "../hub-probe-wire", optional = true }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"], optional = true }
rustls-pemfile = { version = "=2.2.0", optional = true }
futures-util = { version = "=0.3.34", features = ["sink"], optional = true }
ring = { version = "=0.17.14", optional = true }
