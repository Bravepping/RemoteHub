[workspace]
members = ["apps/desktop/src-tauri", "crates/hub-capture-win", "crates/hub-encode-win", "crates/hub-webrtc", "crates/hub-turn-credentials", "crates/hub-probe-wire", "crates/hub-rendezvous-probe"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "LicenseRef-RemoteHub-Personal"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# Native media experiments need optimized CPU conversion without repeated whole-app LTO.
[profile.probe]
inherits = "release"
lto = false
codegen-units = 16
