[package]
name = "remotehub-desktop"
default-run = "remotehub-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "remotehub-display-check"
path = "src/bin/display_check.rs"
required-features = ["synthetic-display-check", "custom-protocol"]

[[bin]]
name = "remotehub-stream-display-check"
path = "src/bin/stream_display_check.rs"
required-features = ["synthetic-stream-display-check", "custom-protocol"]

[features]
synthetic-stream-display-check = ["dep:hub-rendezvous-probe", "dep:tokio"]
synthetic-display-check = []
p3-lan = ["p005-control", "hub-webrtc/p3-lan"]
p3-lan-input-queue-test = ["p3-lan", "hub-webrtc/p3-lan-input-queue-test"]
v2-peer-pairing = ["p3-lan"]
v2-verified-lan = ["v2-peer-pairing", "hub-webrtc/v2-verified-lan"]
v2-public-video-desktop = ["v2-verified-lan", "hub-webrtc/v2-public-video-wss", "dep:hub-encode-win", "dep:base64", "dep:sha2", "dep:zeroize", "windows/Win32_Storage_FileSystem"]
v2-public-control-desktop = ["v2-public-video-desktop", "hub-webrtc/v2-public-control"]
v2-public-video-60s-test = ["v2-public-video-desktop", "hub-encode-win/v2-public-video-60s-test", "hub-webrtc/v2-public-video-60s-test"]
v2-private-wss-lan = ["v2-verified-lan", "hub-webrtc/v2-private-wss-lan"]
v2-loopback-diagnostic = ["p3-lan", "hub-webrtc/v2-loopback-signaling"]
custom-protocol = ["tauri/custom-protocol"]
p004-probe = ["dep:hub-webrtc", "dep:tokio", "dep:uuid", "dep:windows", "dep:serde_json"]
p004-lan = ["p004-probe"]
p005-control = ["p004-lan"]
p006-turn-probe = ["dep:hub-webrtc", "hub-webrtc/p006-turn-probe"]
p006-relay = ["p005-control", "hub-webrtc/p006-relay", "dep:hub-probe-wire", "windows/Win32_NetworkManagement_IpHelper"]
p006-direct = ["p006-relay", "hub-webrtc/p006-direct"]
p007b-diag = ["p006-direct", "hub-webrtc/p006-session-probe"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon"] }
serde.workspace = true
hub-capture-win = { path = "../../../crates/hub-capture-win" }
hub-identity = { path = "../../../crates/hub-identity" }
hub-rendezvous-probe = { path = "../../../crates/hub-rendezvous-probe", features = ["v2-synthetic-video"], optional = true }
hub-encode-win = { path = "../../../crates/hub-encode-win", optional = true }
base64 = { version = "=0.22.1", optional = true }
sha2 = { version = "=0.10.9", optional = true }
zeroize = { version = "=1.9.2", optional = true }
hub-webrtc = { path = "../../../crates/hub-webrtc", optional = true }
hub-probe-wire = { path = "../../../crates/hub-probe-wire", optional = true }
tokio = { version = "=1.54.1", features = ["sync", "time", "macros"], optional = true }
uuid = { version = "=1.29.3", features = ["v4"], optional = true }
serde_json = { workspace = true, optional = true }
windows = { version = "=0.62.2", features = ["Win32_UI_WindowsAndMessaging"], optional = true }

[dev-dependencies]
serde_json.workspace = true
